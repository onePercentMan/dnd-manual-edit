<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Action Copy Editor</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="action-container">

  <div class="header">
    <span class="name">HINAYUPAK</span>
    <button class="edit-btn">Edit</button>
  </div>

  <div class="hitRoll">
    <div class="rollname">Hit</div>
    <span class="hitRollValue copy-text">1D20+7</span>
    <button class="copy-btn">Copy</button>
    <button class="adv-copy-btn">Adv/Dis</button>
  </div>

  <div class="DmgRoll">
    <div class="rollname">Damage</div>
    <span class="DmgRollValue copy-text">1D8+4</span>
    <button class="copy-btn">Copy</button>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
