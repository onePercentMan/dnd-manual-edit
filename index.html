<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Dice Tool (TaleSpire)</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="action-container">

  <!-- HEADER -->
  <div class="header">
    <span class="name">True Name Trident</span>
    <button class="edit-btn">Edit</button>
  </div>

  <!-- HIT ROLL -->
  <div class="roll hit-roll">
    <div class="rollname">Hit</div>

    <div class="dice-inputs">
      <input type="number" class="hit-count" min="1" value="1">
      <span class="fixed-die">d20</span>
      <input type="number" class="hit-mod" value="0">
    </div>

    <div class="roll-output hit-output"></div>

    <div class="roll-actions">
      <button class="copy-btn hit-copy">Copy</button>
      <button class="adv-copy-btn hit-adv">Adv/Dis</button>
    </div>
  </div>

  <!-- DAMAGE ROLL -->
  <div class="roll dmg-roll">
    <div class="rollname">Damage</div>

    <div class="dice-inputs">
      <input type="number" class="dmg-count" min="1" value="1">

      <!-- Trident damage options -->
      <select class="dmg-die">
        <option value="8">1d8 (One-Handed)</option>
        <option value="10">1d10 (Two-Handed)</option>
      </select>

      <input type="number" class="dmg-mod" value="0">
    </div>

    <div class="roll-output dmg-output"></div>

    <div class="roll-actions">
      <button class="copy-btn dmg-copy">Copy</button>
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
