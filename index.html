<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Personal Dice Tool</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="action-container">

  <!-- HEADER / NAME -->
  <div class="header">
    <!-- THIS is the label used when copying -->
    <span class="name">Rapier Attack</span>
    <button class="edit-btn">Edit</button>
  </div>

  <!-- =========================
       HIT ROLL (d20 ONLY)
       ========================= -->
  <div class="roll hit-roll">
    <div class="rollname">Hit</div>

    <div class="dice-inputs">
      <input
        type="number"
        class="hit-count"
        min="1"
        value="1"
        title="Number of d20s"
      >
      <span class="fixed-die">d20</span>
      <input
        type="number"
        class="hit-mod"
        value="0"
        title="Hit modifier"
      >
    </div>

    <div class="roll-output hit-output"></div>

    <div class="roll-actions">
      <button class="copy-btn hit-copy">Copy</button>
      <button class="adv-copy-btn hit-adv">Adv/Dis</button>
    </div>
  </div>

  <!-- =========================
       DAMAGE ROLL
       ========================= -->
  <div class="roll dmg-roll">
    <div class="rollname">Damage</div>

    <div class="dice-inputs">
      <input
        type="number"
        class="dmg-count"
        min="1"
        value="1"
        title="Number of damage dice"
      >
      <select class="dmg-die" title="Damage die">
        <option value="4">d4</option>
        <option value="6">d6</option>
        <option value="8" selected>d8</option>
        <option value="10">d10</option>
        <option value="12">d12</option>
        <option value="20">d20</option>
      </select>
      <input
        type="number"
        class="dmg-mod"
        value="0"
        title="Damage modifier"
      >
    </div>

    <div class="roll-output dmg-output"></div>

    <div class="roll-actions">
      <button class="copy-btn dmg-copy">Copy</button>
      <!-- NO ADV/DIS HERE BY DESIGN -->
    </div>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
